basePath: /
definitions:
  models.CreateBatchTicketsRequest:
    properties:
      jadwal_id:
        description: |-
          The ID of the schedule for which tickets are being booked
          example: 60d21b4667d0d8992e610c85
        type: string
      kursis:
        description: |-
          Array of seat codes to book
          example: ["A1", "A2", "A3"]
        items:
          type: string
        type: array
      user_id:
        description: |-
          The ID of the user booking the tickets
          example: 60d21b4667d0d8992e610c84
        type: string
    type: object
  models.Film:
    properties:
      _id:
        type: string
      description:
        type: string
      duration:
        type: integer
      genre:
        items:
          type: string
        type: array
      poster_url:
        type: string
      rating:
        type: string
      title:
        type: string
    type: object
  models.Jadwal:
    properties:
      _id:
        type: string
      film_id:
        type: string
      film_title:
        type: string
      harga:
        type: number
      ruangan:
        type: string
      tanggal:
        type: string
      waktu:
        type: string
    type: object
  models.MetodePembayaran:
    properties:
      description:
        description: |-
          A description of the payment method
          example: Transfer ke rekening bank yang tersedia
        type: string
      id:
        description: |-
          The payment method ID
          example: transfer_bank
        type: string
      logo:
        description: |-
          Optional URL to the payment method's logo
          example: /images/transfer_bank.png
        type: string
      name:
        description: |-
          The display name of the payment method
          example: Transfer Bank
        type: string
    type: object
  models.PaymentRequest:
    properties:
      bukti_pembayaran:
        description: |-
          URL or base64 of payment proof (optional)
          example: https://example.com/payment-proof.jpg
        type: string
      jumlah:
        description: |-
          The amount being paid
          example: 50000
        type: number
      metode_pembayaran:
        description: |-
          The payment method used
          example: transfer_bank
        type: string
      tiket_id:
        description: |-
          The ID of the ticket being paid for
          example: 60d21b4667d0d8992e610c86
        type: string
      user_id:
        description: |-
          The ID of the user making the payment
          example: 60d21b4667d0d8992e610c84
        type: string
    type: object
  models.Pembayaran:
    properties:
      _id:
        type: string
      bukti_pembayaran:
        type: string
      created_at:
        type: string
      jumlah:
        type: number
      metode_pembayaran:
        type: string
      status:
        type: string
      tanggal_pembayaran:
        type: string
      tiket_id:
        type: string
      updated_at:
        type: string
    type: object
  models.TicketSummary:
    properties:
      film_poster:
        description: |-
          The URL to the film's poster image
          example: https://example.com/posters/avengers.jpg
        type: string
      film_title:
        description: |-
          The title of the film
          example: Avengers: Endgame
        type: string
      harga_tiket:
        description: |-
          The ticket price
          example: 50000
        type: number
      jadwal_ruangan:
        description: |-
          The theater room for the film
          example: Studio 3
        type: string
      jadwal_tanggal:
        description: |-
          The scheduled date for the film
          example: 2025-07-25
        type: string
      jadwal_waktu:
        description: |-
          The scheduled time for the film
          example: 19:30
        type: string
      status_pembayaran:
        description: |-
          The payment status
          example: completed
        type: string
      tanggal_pembayaran:
        description: The payment date (if paid)
        type: string
      tiket:
        allOf:
        - $ref: '#/definitions/models.Tiket'
        description: The ticket details
    type: object
  models.Tiket:
    properties:
      _id:
        type: string
      created_at:
        type: string
      jadwal_id:
        type: string
      kursi:
        type: string
      status:
        type: string
      tanggal_pembelian:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.User:
    properties:
      address:
        type: string
      email:
        type: string
      firstname:
        type: string
      gender:
        type: string
      lastname:
        type: string
      password:
        type: string
      phone_number:
        type: string
      profile_picture_url:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  models.UserLogin:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.UserRegister:
    properties:
      address:
        type: string
      email:
        type: string
      firstname:
        type: string
      gender:
        type: string
      lastname:
        type: string
      password:
        type: string
      phone_number:
        type: string
      profile_picture_url:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
host: localhost:3000
info:
