basePath: /
definitions:
  models.Film:
    properties:
      description:
        type: string
      duration:
        description: in minutes
        type: integer
      genre:
        items:
          type: string
        type: array
      poster_url:
        type: string
      rating:
        type: string
      title:
        type: string
    type: object
  models.Jadwal:
    properties:
      film_id:
        type: string
      film_title:
        type: string
      harga:
        type: number
      ruangan:
        description: 'enum: Studio 1-5'
        type: string
      tanggal:
        description: 'format: YYYY-MM-DD'
        type: string
      waktu:
        description: 'format: HH:MM'
        type: string
    type: object
  models.Tiket:
    properties:
      _id:
        type: string
      created_at:
        type: string
      jadwal_id:
        type: string
      kursi:
        type: string
      status:
        description: 'enum: TiketStatusConfirmed, TiketStatusCancelled, TiketStatusUsed'
        type: string
      tanggal_pembelian:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.User:
    properties:
      address:
        type: string
      email:
        type: string
      firstname:
        type: string
      gender:
        type: string
      lastname:
        type: string
      password:
        type: string
      phone_number:
        type: string
      profile_picture_url:
        type: string
      role:
        description: '"user" or "admin"'
        type: string
      username:
        type: string
    type: object
  models.UserLogin:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.UserRegister:
    properties:
      address:
        type: string
      email:
        type: string
      firstname:
        type: string
      gender:
        type: string
      lastname:
        type: string
      password:
        type: string
      phone_number:
        type: string
      profile_picture_url:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Cinema ticket booking system with payment integration
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Cinema Booking API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and get JWT token
      parameters:
      - description: User login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user (user or admin)
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.UserRegister'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - Auth
  /api/films:
    get:
      consumes:
      - application/json
      description: Get list of all films in the cinema
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Film'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all films
      tags:
      - Films
    post:
      consumes:
      - application/json
      description: Create a new film in the cinema
      parameters:
      - description: Film object
        in: body
        name: film
        required: true
        schema:
          $ref: '#/definitions/models.Film'
      produces:
      - application/json
      responses:
        "201":
          description: '{ ''message'': ''Film created successfully'', ''film'': {
            ...film fields... } }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ ''error'': ''Invalid input'' }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ ''error'': ''Internal server error'' }'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new film
      tags:
      - Films
  /api/films/{id}:
    delete:
      consumes:
      - application/json
      description: Delete film by ID
      parameters:
      - description: Film ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a film
      tags:
      - Films
    get:
      consumes:
      - application/json
      description: Get a single film by its ID
      parameters:
      - description: Film ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Film'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get film by ID
      tags:
      - Films
    put:
      consumes:
      - application/json
      description: Update film by ID
      parameters:
      - description: Film ID
        in: path
        name: id
        required: true
        type: string
      - description: Film object
        in: body
        name: film
        required: true
        schema:
          $ref: '#/definitions/models.Film'
      produces:
      - application/json
      responses:
        "200":
          description: '{ ''message'': ''Film updated successfully'' }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ ''error'': ''Invalid input'' }'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: '{ ''error'': ''Film not found or update failed'' }'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a film
      tags:
      - Films
  /api/jadwals:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Jadwal'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all jadwal
      tags:
      - Jadwal
    post:
      consumes:
      - application/json
      parameters:
      - description: Jadwal object
        in: body
        name: jadwal
        required: true
        schema:
          $ref: '#/definitions/models.Jadwal'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create new jadwal
      tags:
      - Jadwal
  /api/jadwals/{id}:
    delete:
      parameters:
      - description: Jadwal ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete jadwal by ID
      tags:
      - Jadwal
    get:
      parameters:
      - description: Jadwal ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Jadwal'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get jadwal by ID
      tags:
      - Jadwal
    put:
      consumes:
      - application/json
      parameters:
      - description: Jadwal ID
        in: path
        name: id
        required: true
        type: string
      - description: Jadwal object
        in: body
        name: jadwal
        required: true
        schema:
          $ref: '#/definitions/models.Jadwal'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update jadwal by ID
      tags:
      - Jadwal
  /api/tikets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Tiket'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all tickets (admin only)
      tags:
      - Tiket
    post:
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
  /api/tikets/{id}:
    get:
      parameters:
      - description: Tiket ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Tiket'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get ticket by ID
      tags:
      - Tiket
    put:
      consumes:
      - application/json
      parameters:
      - description: Tiket ID
        in: path
        name: id
        required: true
        type: string
      - description: Tiket object
        in: body
        name: tiket
        required: true
        schema:
          $ref: '#/definitions/models.Tiket'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update ticket (seat/status)
      tags:
      - Tiket
  /api/tikets/batal/{id}:
    put:
      parameters:
      - description: Tiket ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancel a ticket
      tags:
      - Tiket
  /api/tikets/kursi-kosong/{jadwalId}:
    get:
      parameters:
      - description: Jadwal ID
        in: path
        name: jadwalId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get available seats for a schedule
      tags:
      - Tiket
  /api/tikets/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Tiket'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user's ticket history
      tags:
      - Tiket
  /api/tikets/user/{user_id}:
    get:
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Tiket'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get tickets by user ID (admin or self)
      tags:
      - Tiket
  /api/users/{id}:
    get:
      description: Get user information by ID (admin only or own profile)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
    put:
      description: Update user information (own profile or admin)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Users
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
