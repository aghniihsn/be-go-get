basePath: /
definitions:
  models.Film:
    properties:
      _id:
        type: string
      created_at:
        type: string
      description:
        type: string
      duration:
        description: in minutes
        type: integer
      genre:
        type: string
      poster_url:
        type: string
      rating:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.User:
    properties:
      _id:
        type: string
      created_at:
        type: string
      email:
        type: string
      password:
        type: string
      role:
        description: '"user" or "admin"'
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Cinema ticket booking system with payment integration
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Cinema Booking API
  version: "1.0"
paths:
  /api/films:
    get:
      consumes:
      - application/json
      description: Get list of all films in the cinema
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Film'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all films
      tags:
      - Films
    post:
      consumes:
      - application/json
      description: Create a new film in the cinema
      parameters:
      - description: Film object
        in: body
        name: film
        required: true
        schema:
          $ref: '#/definitions/models.Film'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new film
      tags:
      - Films
  /api/films/{id}:
    delete:
      consumes:
      - application/json
      description: Delete film by ID
      parameters:
      - description: Film ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete a film
      tags:
      - Films
    get:
      consumes:
      - application/json
      description: Get a single film by its ID
      parameters:
      - description: Film ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Film'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get film by ID
      tags:
      - Films
    put:
      consumes:
      - application/json
      description: Update film by ID
      parameters:
      - description: Film ID
        in: path
        name: id
        required: true
        type: string
      - description: Film object
        in: body
        name: film
        required: true
        schema:
          $ref: '#/definitions/models.Film'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Update a film
      tags:
      - Films
  /api/users/{id}:
    get:
      description: Get user information by ID (admin only or own profile)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
    put:
      description: Update user information (own profile or admin)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Users
schemes:
- http
swagger: "2.0"
